<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<title>Document</title>
	</head>
	<body>
		<h1>Калькулятор стоимости доставки</h1>
		<form action="#" method="post" class="form">
			<label
				>Название тоара:
				<input type="text" class="namwProduct" required />
			</label>
			<label>
				Вес товара (кг):
				<input type="number" class="weightProduct" required />
			</label>
			<label>
				Расстояние доставки (км)
				<input type="number" class="distanceDeliver" required />
			</label>
			<button class="formBtn" type="submit">Добавить товар</button>
		</form>

		<table class="product-table">
			<thead>
				<tr>
					<th>Название товара</th>
					<th>Вес (кг)</th>
					<th>Расстояние (км)</th>
					<th>Стоимость доставки</th>
				</tr>
				
			</thead>
			<tbody>
				<!-- Здесь будут добавляться товары -->
			</tbody>
		</table>
		<script src="main.js"></script>
	</body>
</html>
